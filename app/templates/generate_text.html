{% extends 'base.html' %} <!-- Extend the base template -->

{% block body %}
<div class="hero">
    <div class="container">
        <h1>Generate Advertisement Text</h1>
        <p class="subtitle">Turn your ideas into compelling advertisements with AI-powered text generation.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="prompt">Enter Advertisement Prompt:</label>
                <input type="text" id="prompt" name="prompt" placeholder="E.g., Advertisement for a new gym" required>
            </div>
            <button type="submit" class="btn-primary">Generate Text</button>
        </form>

        {% if generated_text %}
            <div class="result">
                <h2><strong>Generated</strong> Advertisement:</h2>
                <div class="ad-content">
                    {{ generated_text|markdown_to_html|linebreaks }} <!-- Convert Markdown to HTML -->
                </div>
            </div>
        {% endif %}
    </div>
</div>

<style>
    /* Ensure styles don't conflict with the base template */
    .hero {
        padding: 8rem 1rem;
        text-align: center;
        background: linear-gradient(to right, #EBF4FF, white);
    }

    .container {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        padding: 2.5rem;
        text-align: center;
        margin: 0 auto;
    }

    h1 {
        font-size: 2rem;
        color: #2C5282;
        margin-bottom: 1rem;
        font-weight: 700;
    }

    .subtitle {
        font-size: 1rem;
        color: #4B5563;
        margin-bottom: 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
    }

    label {
        display: block;
        font-size: 0.875rem;
        color: #374151;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }

    input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        font-size: 0.875rem;
        border: 1px solid #D1D5DB;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
        border-color: #3B82F6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-primary {
        background-color: #2C5282;
        color: white;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #1A365D;
    }

    .result {
        margin-top: 2rem;
        background-color: #F9FAFB;
        padding: 1.5rem;
        border-radius: 8px;
        border: 1px solid #E5E7EB;
        text-align: left;
    }

    .result h2 {
        font-size: 1.25rem;
        color: #2C5282;
        margin-bottom: 1rem;
    }

    .ad-content {
        font-size: 0.875rem;
        color: #374151;
        line-height: 1.6;
        white-space: pre-wrap; /* Preserve line breaks and formatting */
    }

    .ad-content strong {
        font-weight: 700;
        color: #2C5282;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .hero {
            padding: 1rem;
        }

        .container {
            padding: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
        }

        .subtitle {
            font-size: 0.875rem;
        }

        .btn-primary {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
    }
</style>
{% endblock %}
